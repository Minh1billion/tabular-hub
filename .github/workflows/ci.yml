name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  client:
    name: Client (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  server:
    name: Server (Verify & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv .venv
          uv pip install --python .venv/bin/python . pytest

      - name: Syntax check & FastAPI app import
        run: |
          cp ../.env.example .env
          .venv/bin/python -m compileall -q app alembic
          .venv/bin/python -c "import app.main; print('Loaded:', app.main.app.title)"

      - name: Run pytest (when tests are present)
        run: |
          if find tests -name "test_*.py" | grep -q .; then
            .venv/bin/pytest
          else
            echo "No test_*.py files found in server/tests, skipping pytest."
          fi

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: tabular-hub-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build client Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: tabular-hub-client:ci
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
