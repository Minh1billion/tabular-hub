[project]
name = "tabular-manner-app"
version = "0.1.0"
description = "MVP app: authentication and workspace management for Tabular Manner"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pydantic-settings",
    "authlib",
    "itsdangerous",
    "httpx",
    "python-jose[cryptography]",
    "tabular-manner @ git+https://github.com/Minh1billion/tabular-manner.git@e96d1323a7f9dc1d54bdc173b768b08fea8043df",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]